<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Prompt Editor</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="bar">
    <input id="root" placeholder="wildcard root" size="24" />
    <button id="pick">folder</button>
    <input id="seed" type="number" value="999" title="seed" />
    <input id="count" type="number" value="8" title="count" />
    <select id="generator"><option>random</option><option>combinatorial</option></select>
    <input id="python" placeholder="pythonPath (blank=auto)" size="16" />
    <button id="refresh">index</button>
  </div>
  <ul id="filelist"></ul>
  <div id="editor"></div>
  <div id="status"></div>
  <div id="actions">
    <button id="save">save</button>
    <button id="run">expand</button>
    <button id="copy">copy</button>
  </div>
  <pre id="results"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
